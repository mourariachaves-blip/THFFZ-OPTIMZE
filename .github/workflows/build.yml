name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: TH-Optimize-APK, path: app/build/outputs/apk/debug/app-debug.apk }
        name: Build APK teste 50MB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Criar arquivo de teste de 50 MB
        run: |
          mkdir -p app/src/main/assets
          head -c 52428800 /dev/urandom > app/src/main/assets/teste_50mb.bin
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: TH-Optimize-TESTE-50MB, path: app/build/outputs/apk/debug/app-debug.apk }
